                  {
                    "color": "orange",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Current replicas chosen by the HorizontalPodAutoscaler (min 2, max 6)"
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Database",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(startline_db_up{job=\"startline-backend\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "description": "1 = the last readiness probe reached PostgreSQL"
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Requests / s by endpoint",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
