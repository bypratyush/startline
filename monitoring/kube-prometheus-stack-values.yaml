# kube-prometheus-stack, trimmed for a 3-node kind cluster on a laptop.
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml
# The release name matters: ServiceMonitors and PrometheusRules are picked up
# when they carry release=monitoring (see helm/startline/values.yaml).

alertmanager:
  enabled: false          # alert rules still evaluate and show on Prometheus /alerts

nodeExporter:
  enabled: false          # kind nodes are containers; cAdvisor via the kubelet covers pod CPU and memory

# control-plane components on kind listen on 127.0.0.1 only: these targets would just sit DOWN
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  # http://prometheus.localhost through the same ingress-nginx as the app (*.localhost needs no /etc/hosts)
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [prometheus.localhost]
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    evaluationInterval: 15s
    # pick up ServiceMonitors/PrometheusRules from every namespace that carry release=monitoring
    serviceMonitorSelectorNilUsesHelmValues: true
    ruleSelectorNilUsesHelmValues: true
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }

grafana:
  adminPassword: startline-grafana   # local demo only, never a real password
  # http://grafana.localhost
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [grafana.localhost]
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests: { cpu: 50m, memory: 128Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 64Mi }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
