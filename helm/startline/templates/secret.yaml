{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.password }}
{{- fail "set database.password (dev) or database.existingSecret (prod)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "startline.dbSecretName" . }}
  labels:
    {{- include "startline.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.database.password | quote }}
{{- end }}
