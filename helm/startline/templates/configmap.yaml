apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "startline.fullname" . }}-config
  labels:
    {{- include "startline.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  WEB_WORKERS: {{ .Values.config.webWorkers | quote }}
  SEED_ON_START: {{ .Values.config.seedOnStart | quote }}
  DB_HOST: {{ include "startline.fullname" . }}-db
  DB_PORT: "5432"
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
