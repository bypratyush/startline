# FAULT 3 - pods that run but never receive traffic.
# The DB password is wrong, so /health (liveness) passes but /ready (readiness)
# returns 503: the container stays Running with READY 0/1 and is kept out of
# its Service. Migrations and seeding are off so the process does not exit.
#   kubectl apply -f troubleshooting/broken-readiness.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: startline-backend-misconfigured
  namespace: startline
  labels:
    app.kubernetes.io/part-of: startline
    lab: troubleshooting
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: startline-backend-misconfigured
  template:
    metadata:
      labels:
        app.kubernetes.io/name: startline-backend-misconfigured
        lab: troubleshooting
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: startline-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: startline-config
          env:
            - { name: DB_PASSWORD, value: "not-the-password" }   # <- should come from the Secret
            - { name: RUN_MIGRATIONS, value: "false" }
            - { name: SEED_ON_START, value: "false" }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
