# Runs scripts/loadgen.py in the cluster (from a ConfigMap) using the backend
# image, so no extra image is pulled. Fits the namespace's "restricted" policy.
apiVersion: batch/v1
kind: Job
metadata:
  name: startline-rush
  namespace: startline
  labels:
    app.kubernetes.io/part-of: startline
    app.kubernetes.io/component: loadgen
spec:
  parallelism: 3
  completions: 3
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: loadgen
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rush
          image: startline-backend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "/loadgen/loadgen.py"]
          env:
            - { name: TARGET, value: "http://startline-backend:8000" }
            - { name: DURATION, value: "180" }
            - { name: CONCURRENCY, value: "8" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: script, mountPath: /loadgen }
      volumes:
        - name: script
          configMap:
            name: startline-loadgen
