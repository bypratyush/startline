# EKS only: values-prod.yaml asks for storageClassName gp3. EKS ships a gp2 class;
# this adds encrypted gp3 volumes, provisioned by the aws-ebs-csi-driver add-on
# (installed by terraform/eks.tf).
#   kubectl apply -f k8s/storageclass-gp3.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: true
